name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests (if present)
        run: npm test --if-present
